<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForestFuture docs</title>
    <meta name="description" content="Documentation for ForestFuture's open source libraries." />
    <meta name="theme-color" content="#2f6b3f" />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* The guide's look (Blume's theme as d1-record.forestfuture.dev sets it): its colors, Inter,
         and its home page's title, cards and footer. */
      @font-face {
        font-family: Inter;
        src: url("/fonts/inter-latin.woff2") format("woff2");
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --background: oklch(100% 0 0);
        --foreground: oklch(14.5% 0 0);
        --muted-foreground: oklch(53% 0 0);
        --border: oklch(88% 0.006 260 / 0.72);
        --accent: #2f6b3f;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(8.5% 0 0);
          --foreground: oklch(96% 0 0);
          --muted-foreground: oklch(68% 0 0);
          --border: oklch(24% 0 0 / 0.8);
          --accent: #8cc79a;
          color-scheme: dark;
        }
      }
      *,
      ::before,
      ::after {
        box-sizing: border-box;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        margin: 0;
        background: var(--background);
        color: var(--foreground);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      main {
        flex: 1;
        width: 100%;
        max-width: calc(54rem + 2 * 16px);
        margin: 0 auto;
        padding: 88px 16px 64px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 2.25rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .lead {
        margin: 0 0 48px;
        color: var(--muted-foreground);
        font-size: 1.125rem;
        line-height: 1.75rem;
      }
      .libraries {
        display: grid;
        gap: 16px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .library {
        display: block;
        height: 100%;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--background);
        transition: border-color 150ms ease;
      }
      .library:hover,
      .library:focus-visible {
        border-color: var(--accent);
      }
      .library:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .library img {
        display: block;
        margin-bottom: 10px;
      }
      .library strong {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .library p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      .library .more {
        margin-top: 16px;
        color: var(--accent);
        font-weight: 500;
      }
      footer {
        border-top: 1px solid var(--border);
        padding: 12px 16px;
      }
      footer div {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 24px;
        min-height: 40px;
        color: var(--muted-foreground);
        font-size: 0.875rem;
        line-height: 1.25rem;
      }
      footer a {
        transition: color 150ms ease;
      }
      footer a:hover,
      footer a:focus-visible {
        color: var(--foreground);
      }
      footer p {
        margin: 0;
      }
      @media (min-width: 640px) {
        h1 {
          font-size: 3rem;
        }
        .libraries {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (min-width: 768px) {
        footer {
          padding: 12px 24px;
        }
        footer div {
          display: grid;
          grid-template-columns: 1fr auto 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ForestFuture docs</h1>
      <p class="lead">Documentation for ForestFuture's open source libraries.</p>
      <ul class="libraries">
        <li>
          <a class="library" href="https://d1-record.forestfuture.dev">
            <img src="https://d1-record.forestfuture.dev/icon.svg" alt="" width="20" height="20" />
            <strong>d1-record</strong>
            <p>A Rails-inspired Active Record for Cloudflare Workers and D1.</p>
            <p class="more">Read the guide →</p>
          </a>
        </li>
      </ul>
    </main>
    <footer>
      <div>
        <span>
          <a href="https://forestfuture.dev">ForestFuture</a>
          &nbsp;·&nbsp;
          <a href="https://github.com/forestfuture">GitHub</a>
        </span>
        <p>A ForestFuture project</p>
      </div>
    </footer>
  </body>
</html>
