name: Docs

# Builds the documentation site and deploys it to docs.forestfuture.dev/d1-record
# (site/wrangler.jsonc). The deploy is skipped until CLOUDFLARE_DOCS_API_TOKEN is set.
on:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Workers Scripts: Edit on the account, and Workers Routes: Edit on the forestfuture.dev zone.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the pages' "last updated" dates come from git history
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run docs:build
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: vp exec wrangler deploy
        working-directory: site
