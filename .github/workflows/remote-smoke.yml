name: Remote D1 smoke

# Against a real remote D1 database (docs/agents/remote-smoke.md). Started by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remote-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-vp
      - run: vp run test:remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_SMOKE_DATABASE_ID: ${{ secrets.D1_SMOKE_DATABASE_ID }}
