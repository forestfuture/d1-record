name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-vp
      - run: vp check
      # Every test, and branch coverage of the library and command line above its floor
      # (vite.config.ts), which the Best Practices dynamic analysis criterion relies on.
      - run: vp run coverage
      - run: vp pack
      # The published types show only the public interface, no library internals.
      - run: vp run check:public-types
      # Unused files, exports and dependencies.
      - run: vp run knip
      # The documentation site builds, with no dead links.
      - run: vp run docs:build
      # The tarball holds exactly the library, its docs for agents (llms-full.txt, skills/d1-record/SKILL.md) and metadata.
      - run: vp run check:package

  # Packs the library as release-pack does (#80): dependencies installed without their install
  # scripts or the shared cache. A release that couldn't be built that way fails here first.
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          release: true
      - run: pnpm pack --out "$RUNNER_TEMP/d1-record.tgz"

  # The documentation site deploys in two jobs (#243), only from main and only once the checks above
  # have passed. The build runs the site's whole dependency tree, so it gets no secrets; the deploy
  # gets the token, and runs only a pinned Wrangler. Both share one queue, so an older run's build
  # can't finish after a newer run's deploy and put back the older site.
  docs-build:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docs
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the pages' "last updated" dates come from git history
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
      - run: vp run docs:build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: site/dist
          include-hidden-files: true # .well-known/, the agent skills and catalogs
          if-no-files-found: error
          retention-days: 1

  # Deploys the guide to d1-record.forestfuture.dev (site/wrangler.jsonc) and the docs.forestfuture.dev
  # library list (site/host/wrangler.jsonc, whose page is committed, not built). It never installs the
  # workspace: Wrangler comes from .github/docs-deploy, which has a lockfile of its own, installed
  # frozen with install scripts off.
  docs-deploy:
    needs: docs-build
    # Repeated, so the token job never follows a wider docs-build condition.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: docs
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.node-version
            /.github/docs-deploy/
            /site/wrangler.jsonc
            /site/host/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: site/dist
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # The pnpm version in the manifest's devEngines.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: .github/docs-deploy/package.json
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .github/docs-deploy
      # Wrangler runs from site/, outside that folder's workspace, so pnpm exec can't reach it there.
      - run: echo "$GITHUB_WORKSPACE/.github/docs-deploy/node_modules/.bin" >> "$GITHUB_PATH"
      - run: wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Workers Scripts: Edit on the account, and Workers Routes: Edit on the forestfuture.dev zone.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}
      - run: wrangler deploy --config host/wrangler.jsonc
        working-directory: site
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DOCS_API_TOKEN }}

  # Releasing (docs/agents/releasing.md): once the checks pass on main, Changesets either opens or
  # updates the "Version Packages" pull request, or, after that pull request is merged, publishes
  # to npm. Only the publish job can get an OIDC token (npm trusted publishing and provenance).
  # The jobs share one queue, so two pushes never version or publish at the same time.
  release-mode:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          release: true
      # "version" while changesets are waiting, "publish" once package.json has a version npm
      # doesn't, and "none" otherwise (most pushes).
      - id: select-mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  release-version:
    needs: release-mode
    if: needs.release-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog links each change to the commit that added its changeset, so it needs
          # the history (a shallow clone would try to fetch more, without credentials).
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          release: true
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Changesets can't run the Oxfmt inside Vite+, so `vp fmt` formats CHANGELOG.md after it,
          # and the merged pull request passes `vp check`.
          script: vp run release:version

  release-pack:
    needs: release-mode
    if: needs.release-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          release: true
      # Packing runs the package's `prepack` script: it builds dist/ (attw and publint included) and
      # the docs site, whose llms-full.txt ships in the package. A broken docs build blocks a release.
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.release-mode.outputs.publish-plan-artifact-id }}

  release-publish:
    needs: release-pack
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # git tags and GitHub Releases
      id-token: write # npm trusted publishing, and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-vp
        with:
          release: true
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.release-pack.outputs.pack-dir-artifact-id }}
          create-github-releases: true
          push-git-tags: true
        env:
          # Changesets publishes with pnpm, which reads PNPM_CONFIG_*, not NPM_CONFIG_*.
          PNPM_CONFIG_PROVENANCE: true
