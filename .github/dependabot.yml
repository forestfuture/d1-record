# Keeps CI's actions (pinned to commit SHAs, #80) and the development dependencies current.
# Updates wait a week after a release (pnpm's minimumReleaseAge works the same way), so a compromised
# release is usually caught before it gets here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
    ignore:
      # Bumped by hand with the catalog's vite (vite-plus-core), which it must equal, and the
      # release-age excludes in pnpm-workspace.yaml. A bump of vite-plus alone fails to type-check
      # (#157); docs/agents/dependencies.md has the steps.
      - dependency-name: "vite-plus"
      # Pinned to the vitest that vite-plus bundles: vp refuses to run coverage on any other
      # (#153). It moves with vite-plus, not on its own.
      - dependency-name: "@vitest/coverage-v8"
      # The types follow the Node the repo runs (.node-version), so only its minors and patches.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The Wrangler that CI's docs-deploy job runs (#243), with a lockfile of its own and outside the
  # workspace, so the job holding the docs token never installs the site's dependencies.
  - package-ecosystem: npm
    directory: /.github/docs-deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-deploy:
        patterns: ["*"]
