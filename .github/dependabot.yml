# Keeps CI's actions (pinned to commit SHAs, #80) and the development dependencies current.
# Updates wait a week after a release (pnpm's minimumReleaseAge works the same way), so a compromised
# release is usually caught before it gets here.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      development:
        dependency-type: development
    ignore:
      # Pinned to the vitest that vite-plus bundles: vp refuses to run coverage on any other
      # (#153). It moves with vite-plus, not on its own.
      - dependency-name: "@vitest/coverage-v8"
      # The types follow the Node the repo runs (.node-version), so only its minors and patches.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
