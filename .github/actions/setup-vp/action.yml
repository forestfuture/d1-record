name: Set up Vite+
description: Installs Vite+ (the version pinned in pnpm-workspace.yaml), Node (.node-version) and pnpm, then runs `vp install`. Check out the repository first.
runs:
  using: composite
  steps:
    - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
      with:
        node-version-file: .node-version
        cache: true
