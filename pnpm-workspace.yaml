packages:
  - .
  - site
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
  # Dev-only advisories (#85): miniflare 4 pins undici 7.28.0 and sharp 0.35.2. Only those
  # majors are lifted, to their patched releases; remove once miniflare ships them.
  "undici@>=7 <7.29.1": ^7.29.1
  "sharp@>=0.35 <0.35.4": ^0.35.4
  # Dev-only advisories in the docs site's tree (#241), each pinned exactly by the package that
  # brings it in: @vercel/routing-utils, @vercel/cli-config and @tailwindcss/typography.
  "path-to-regexp@>=4 <6.3.0": ^6.3.0
  "zod@>=4 <4.6.6": ^4.6.6
  "postcss-selector-parser@<7.1.6": ^7.1.6
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.1.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.1.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.1.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.1.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.1.0"
  - vite-plus@1.1.0
